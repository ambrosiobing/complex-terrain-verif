[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-terrain-verif"
version = "0.2.0"
description = "Station verification of open AI weather forecasts in complex terrain: the Alps and the Nordics. Same initial conditions, fair baselines, honest scores."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Joseph Ambrose Pagaran" }]
keywords = ["weather", "verification", "complex-terrain", "aifs", "anemoi", "peakweather", "frost", "meteoswiss", "met-norway", "machine-learning", "forecast-evaluation"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "xarray>=2023.6",
    "netCDF4>=1.6",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
grib = ["ecmwf-opendata>=0.3", "cfgrib>=0.9.11", "eccodes>=2.35"]
earthkit = ["ecmwf-opendata>=0.3", "earthkit-data>=0.10"]
verif = ["verif>=1.3"]
anemoi = ["anemoi-inference>=0.5", "torch>=2.2"]
# Alpine domain: the MeteoSwiss station dataset, and metrics on labelled arrays.
alps = ["peakweather>=0.1", "xskillscore>=0.0.24"]
# Circulation classification: reanalysis access and a blocking index.
regimes = ["cdsapi>=0.7", "contrack>=0.3"]
# Spatial quality control and elevation-aware downscaling, both compiled.
# Prefer conda-forge for these; see pixi.toml.
qc = ["titanlib>=0.3"]
downscale = ["gridpp>=0.7"]
# Self-hosting: a read-only service over results already computed. No model runs here.
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "duckdb>=1.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/ambrosiobing/complex-terrain-verif"

[project.scripts]
afv = "afv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet and credentials (deselected by default)",
    "grib: needs eccodes/cfgrib installed",
    "optdep: needs an optional compiled dependency (titanlib, gridpp, contrack)",
]
addopts = "-m 'not network and not grib'"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["build", "dist", ".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP007", "UP035", "UP006", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E712"]
# The subparser table is one statement per subcommand, deliberately, so the whole
# command surface reads as a table rather than as sixty scattered lines.
"src/afv/cli.py" = ["E702"]
