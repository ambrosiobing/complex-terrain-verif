[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aifs-frost-verif"
version = "0.1.0"
description = "Station verification of open AI weather forecasts (ECMWF AIFS) against MET Norway Frost observations, Bergen northwards. Same initial conditions, fair baselines, honest scores."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Joseph Ambrose Pagaran" }]
keywords = ["weather", "verification", "aifs", "anemoi", "frost", "met-norway", "machine-learning", "forecast-evaluation"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "xarray>=2023.6",
    "netCDF4>=1.6",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
grib = ["ecmwf-opendata>=0.3", "cfgrib>=0.9.11", "eccodes>=2.35"]
earthkit = ["ecmwf-opendata>=0.3", "earthkit-data>=0.10"]
verif = ["verif>=1.3"]
anemoi = ["anemoi-inference>=0.5", "torch>=2.2"]

[project.urls]
Homepage = "https://github.com/ambrosiobing/aifs-frost-verif"

[project.scripts]
afv = "afv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet and FROST_CLIENT_ID (deselected in CI)",
    "grib: needs eccodes/cfgrib installed",
]
addopts = "-m 'not network and not grib'"
