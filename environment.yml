# conda-forge fallback when pip eccodes wheels fail on Windows.
#   conda env create -f environment.yml && conda activate afv && pip install -e ".[dev]"
name: afv
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy
  - pandas
  - pyarrow
  - xarray
  - netcdf4
  - scipy
  - matplotlib
  - pyyaml
  - requests
  - python-dotenv
  - eccodes
  - cfgrib
  - pytest
  - jupyterlab
  - pip
  - pip:
      - ecmwf-opendata
      - verif
